<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Path6 · Demo</title>
<meta name="description" content="Demo de Path6: la red donde autores, lectores beta, correctores, ilustradores y promotores literarios se encuentran y colaboran.">
<meta name="theme-color" content="#FFFFFF">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PATH 6 · SISTEMA DE DISEÑO
   1. Tokens   2. Base   3. Layout   4. Componentes   5. Vistas   6. Visor
   Regla: los componentes solo usan tokens (var(--…)), nunca colores sueltos.
   ===================================================================== */

/* ---------- 1. Tokens ---------- */
:root{
  /* Marca (paleta Atardecer vivo) */
  --coral:#FF7F6E; --apricot:#FFB86B; --green:#8BC34A;
  --pink:#F7A1B5; --lilac:#C9A7EB; --mint:#7FCFC4; --star:#F59E0B;
  --on-color:#16142B;               /* texto sobre cualquier color de marca */

  /* Superficies y texto */
  --bg:#FFF8F4; --surface:#FFFFFF; --surface-2:#FFF0E8; --line:#F2E2D9;
  --text:#16142B; --muted:#5A5873;
  --ink:#16142B; --on-ink:#FFFFFF;  /* botones principales */
  --accent:#C2412D;                 /* enlaces y foco (coral oscuro, AA) */
  --nav:#16142B; --logo:#16142B; --bubble-me:#16142B; --on-bubble-me:#FFFFFF;

  /* Estados */
  --ok:#15803D; --warn:#B45309; --danger:#C2412D;

  /* Alias de color por etapa/rol */
  --p1:var(--coral); --p2:var(--green); --p3:var(--pink); --p4:var(--apricot); --p5:var(--lilac); --p6:var(--mint);

  /* Forma */
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;
  --radius:var(--r-xl);

  /* Sombras */
  --sh-1:0 1px 2px rgba(20,20,40,.04),0 6px 18px rgba(20,20,40,.06);
  --sh-2:0 10px 30px rgba(22,20,43,.28);
  --sh-3:0 -10px 40px rgba(0,0,0,.2);
  --shadow:var(--sh-1);

  /* Tipografía */
  --font-ui:"Plus Jakarta Sans",system-ui,sans-serif;
  --font-read:Literata,Georgia,serif;
  --fs-xs:11px; --fs-sm:13px; --fs-md:15px; --fs-lg:18px; --fs-xl:26px; --fs-xxl:30px;

  /* Espacio */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;

  /* Papel (visor de documentos): siempre claro */
  --paper:#FFFFFF; --paper-ink:#1D1B22; --paper-muted:#6B6577; --paper-line:#EEE6E0; --paper-soft:#FFF0E8;
  --viewer-bg:#2B2B2E; --viewer-bar:#1C1C1E;
}

/* ---------- 2. Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-md)/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--font-ui);font-weight:800;line-height:1.2;margin:0;letter-spacing:-.02em}
h1{font-size:var(--fs-xl)} h2{font-size:var(--fs-lg)} h3{font-size:16px}
.muted{color:var(--muted)} .small{font-size:var(--fs-sm)}
.hash{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- 3. Layout ---------- */
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:120px}
main{padding:var(--sp-4)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.stack>*+*{margin-top:var(--sp-3)}
.section{margin-top:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.section-head a{font-size:var(--fs-sm);font-weight:700;color:var(--accent);text-decoration:none}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.soon{opacity:.55}

/* ---------- 4. Componentes ---------- */
/* Barra superior y logo */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:var(--sp-3) var(--sp-4);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:var(--sp-2);text-decoration:none;font-weight:800}
.logo span{text-transform:uppercase;letter-spacing:.06em;font-size:var(--fs-lg)}
.logo .mark circle,.logo .mark path{fill:var(--logo)}
.pill{font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px var(--sp-2);border-radius:var(--r-pill);background:var(--surface-2);color:var(--muted)}
@media (max-width:400px){.topbar .pill{display:none}}
.bell{position:relative;border:0;background:var(--surface-2);color:var(--text);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.bell i{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:var(--on-color);font:800 var(--fs-xs)/18px var(--font-ui);font-style:normal;text-align:center;border:2px solid var(--bg)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--r-pill);padding:11px 18px;font-weight:700;background:var(--ink);color:var(--on-ink);text-decoration:none;white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.sm{padding:7px var(--sp-3);font-size:var(--fs-sm)}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{border:0;background:none;padding:0;font:700 12px var(--font-ui);color:var(--accent);cursor:pointer}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.back{display:inline-flex;align-items:center;gap:var(--sp-1);font-weight:700;font-size:14px;text-decoration:none;color:var(--muted);margin-bottom:var(--sp-3)}

/* Tarjetas (una base + variantes) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--sp-4);box-shadow:var(--sh-1)}
.card-link{display:block;text-decoration:none;color:inherit}
.tint{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:transparent;box-shadow:none}
.req{background:var(--surface-2);border-color:transparent;box-shadow:none}
.cta,.cmp{box-shadow:none}
.cta{text-align:center}
.soonbox{text-align:center;border-style:dashed;box-shadow:none}
.next{background:var(--coral);border-radius:var(--radius);padding:var(--sp-4) 18px;color:var(--on-color);margin-top:14px;--text:var(--on-color);--muted:#2E2A26}
.next .btn{background:var(--on-color);color:#FFFFFF}
.mapcard{padding:6px 2px}
.jobc{padding:0}
.appicon{width:64px;height:64px;margin:0 auto var(--sp-3)}
.appicon svg{width:100%;height:100%}

/* Chips (filtros) y etiquetas (datos) */
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);padding-bottom:var(--sp-1)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:6px var(--sp-3);font-size:var(--fs-sm);font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:12px;font-weight:700;padding:3px 9px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--c,var(--muted)) 30%,#FFFFFF);color:var(--on-color)}
.lvl{--c:var(--muted)} .lvl-junior{--c:var(--mint)} .lvl-intermedio{--c:var(--apricot)} .lvl-senior{--c:var(--lilac)}
.price{font-weight:800;font-size:var(--fs-sm);padding:6px var(--sp-3);border-radius:var(--r-pill);background:var(--surface);color:var(--text);white-space:nowrap}
.verified{display:inline-flex;align-items:center;gap:3px;color:var(--text);font-size:12px;font-weight:700}
.verified svg{color:var(--coral)}
.stars{font-weight:700;font-size:var(--fs-sm)} .stars i{color:var(--star);font-style:normal}
.status{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.status.progress{color:var(--warn)} .status.delivered{color:var(--accent)} .status.done{color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--coral);flex:none}

/* Avatares y portadas */
.avatar{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.avatar svg{display:block}
.avatar.lg{width:76px;height:76px}
.avatar.xs{width:28px;height:28px;border:2px solid var(--surface)}
.avatars{display:flex} .avatars .avatar+.avatar{margin-left:-8px}
.cover{position:relative;overflow:hidden;width:72px;height:100px;border-radius:6px var(--r-md) var(--r-md) 6px;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.2);display:grid;place-items:end start;padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3);font-weight:700;font-size:10px;line-height:1.1}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:rgba(0,0,0,.18);z-index:1}
.cover>span{position:relative;z-index:2;color:var(--on-color)}
.cover.mini{width:40px;height:54px;padding:0}
.cover.mini span{display:none}

/* Listas, miembros, archivos */
.list-item{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-3) 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.list-item:first-child{border-top:0}
.list-item.nt{width:100%;border-left:0;border-right:0;border-bottom:0;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left}
.member{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3) 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0;padding-top:0}
.file{display:flex;gap:var(--sp-3);align-items:center;padding:10px;border-radius:var(--r-md);background:var(--surface-2)}
.file.open{cursor:pointer}
.file.open:hover{outline:2px solid var(--line)}
.file .ico{width:36px;height:36px;border-radius:9px;background:var(--surface);display:grid;place-items:center;flex:none}
.ico.pdf{width:38px;height:46px;border-radius:6px;background:var(--coral);color:var(--on-color);font:800 10px var(--font-ui);display:grid;place-items:center;flex:none}

/* Formularios */
.field{display:block}
.field>span{display:block;font-size:var(--fs-sm);font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px var(--sp-3)}
.search{display:flex;align-items:center;gap:var(--sp-2);border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:10px 14px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.toggle{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);font-weight:600}
.opt{display:flex;gap:var(--sp-3);align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-3);cursor:pointer}
.opt:has(input:checked),.opt.on{border-color:var(--text);background:var(--surface-2)}
.opt input{margin-top:3px;accent-color:var(--coral)}
.roleb{flex-direction:column;align-items:flex-start;gap:6px;width:100%;background:var(--surface);font:inherit;color:inherit;text-align:left}
input[type=range]{accent-color:var(--coral)}

/* Notas, resúmenes, pasos */
.note{display:flex;gap:10px;align-items:flex-start;padding:var(--sp-3);border-radius:var(--r-lg);background:color-mix(in srgb,var(--green) 22%,transparent);font-size:var(--fs-sm)}
.note svg{flex:none;width:20px;height:20px;color:var(--ok)}
.sum{width:100%;border-collapse:collapse;font-size:14px}
.sum td{padding:6px 0} .sum td:last-child{text-align:right;font-weight:700}
.sum tr.total td{border-top:1px solid var(--line);padding-top:10px;font-size:16px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:var(--sp-3)}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--coral);width:20px;border-radius:var(--r-pill)}
.stepper{display:flex;gap:var(--sp-1);margin:14px 0 var(--sp-1)}
.stepper span{flex:1;height:6px;border-radius:var(--r-pill);background:var(--surface-2)}
.stepper span.on{background:var(--ink)}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-1);margin-top:var(--sp-3)}
.tl span{font-size:var(--fs-xs);font-weight:700;color:var(--muted);text-align:center;border-top:4px solid var(--surface-2);padding-top:6px}
.tl span.on{color:var(--text);border-color:var(--coral)}
.rate{display:flex;gap:6px;justify-content:center;margin:var(--sp-2) 0 14px}
.rate button{border:0;background:none;font-size:34px;line-height:1;color:var(--line);padding:2px}
.rate button.on{color:var(--star)}
.success{text-align:center;padding:10px 0}
.success .big{width:64px;height:64px;border-radius:50%;margin:0 auto var(--sp-3);display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}

/* Camino: versión compacta (puntos) y mapa (SVG) */
.path{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--sp-1);margin-top:var(--sp-4);position:relative}
.path::before{content:'';position:absolute;left:8.33%;right:8.33%;top:6px;border-top:2px dashed color-mix(in srgb,var(--text) 30%,transparent)}
.path .st{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);position:relative}
.path .bar{width:14px;height:14px;border-radius:50%;margin:0 auto 6px;background:var(--surface);border:2px solid color-mix(in srgb,var(--text) 30%,transparent)}
.path .st.on .bar{background:var(--text);border-color:var(--text)}
.path .st.now{color:var(--text)}
.path .st.now .bar{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 4px color-mix(in srgb,var(--coral) 30%,transparent)}
.pmap{width:100%;height:auto;display:block}
.pmap .lab{font:700 13.5px var(--font-ui);fill:var(--text)}
.pmap .sub{font:500 11.5px var(--font-ui);fill:var(--muted)}
.pmap .ini{font:800 13px var(--font-ui);fill:var(--on-color)}
.pmap .plus{font-size:18px;fill:var(--muted)}
.pmap a:focus-visible circle{stroke:var(--accent);stroke-width:3}
.pmap .pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}

/* Insignias, estadísticas, portfolio, valoraciones */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;font-size:11.5px;font-weight:700;padding:var(--sp-3) 6px;border-radius:var(--r-lg);background:color-mix(in srgb,var(--c) 32%,#FFFFFF);color:var(--on-color)}
.badge:nth-child(1){--c:var(--mint)} .badge:nth-child(2){--c:var(--coral)} .badge:nth-child(3){--c:var(--green)}
.badge:nth-child(4){--c:var(--pink)} .badge:nth-child(5){--c:var(--apricot)} .badge:nth-child(6){--c:var(--lilac)}
.badge .b{font-size:22px;display:block;margin-bottom:var(--sp-1)}
.badge.locked{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.badge.locked .b{filter:grayscale(1);opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-top:var(--sp-3)}
.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;text-align:center}
.stats b{display:block;font-size:var(--fs-lg)} .stats span{font-size:12px;color:var(--muted)}
.portfolio{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.portfolio div{aspect-ratio:3/4;border-radius:10px;display:grid;place-items:end start;padding:7px;font-size:10.5px;font-weight:700;color:#FFFFFF;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.portfolio .open{cursor:pointer;position:relative}
.portfolio .opn{position:absolute;top:6px;right:6px;background:#FFFFFF;color:var(--on-color);font-size:10px;padding:2px 7px;border-radius:var(--r-pill);text-shadow:none}
.review{padding:var(--sp-3) 0;border-top:1px solid var(--line)}
.review:first-of-type{border-top:0}

/* Perfil profesional: experiencia y precio justo */
.exp{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin-top:14px;text-align:left}
.exp>div{background:var(--surface-2);border-radius:var(--r-md);padding:var(--sp-2) 10px}
.exp span{display:block} .exp b{display:block;font-size:var(--fs-sm);line-height:1.35}
.fair .fp{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em}
.fair .okk,.pm-ok{color:var(--ok);font-weight:700}
.pm-lo,.pm-hi{color:var(--danger);font-weight:700}
.fair input[type=range]{width:100%;padding:0;border:0}
.why{margin-top:var(--sp-3);background:var(--surface-2);border-radius:var(--r-md);padding:10px var(--sp-3)}
.why summary{font-weight:700;cursor:pointer}
.why ol{margin:var(--sp-2) 0 0;padding-left:18px;font-size:var(--fs-sm);line-height:1.5}
.why li{margin-bottom:var(--sp-1)}
.soonlist{display:grid;gap:var(--sp-2);text-align:left;margin:0 0 14px}
.soonlist div{background:var(--surface-2);border-radius:var(--r-md);padding:10px var(--sp-3)}
.soonlist b{display:block;font-size:14px} .soonlist span{font-size:var(--fs-sm);color:var(--muted)}
.cline{font:15px/1.6 var(--font-read);background:var(--surface-2);border-radius:var(--r-md);padding:10px var(--sp-3);margin:10px 0 var(--sp-2)}

/* Inicio */
.greet{display:flex;align-items:center;gap:14px}
.uname{font-size:var(--fs-xxl);line-height:1.05;margin-top:2px}

/* Chat */
.chat{display:flex;flex-direction:column;gap:var(--sp-2)}
.msg{max-width:82%;padding:9px 13px;border-radius:var(--r-lg);background:var(--surface-2);font-size:14px}
.msg.me{align-self:flex-end;background:var(--bubble-me);color:var(--on-bubble-me);border-bottom-right-radius:5px}
.msg.them{border-bottom-left-radius:5px}
.msg.sys{align-self:center;max-width:94%;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12.5px;text-align:center}
.msg .who{display:block;font-size:var(--fs-xs);font-weight:700;opacity:.7}
.msg.attach{border:0;cursor:pointer;font:inherit;min-width:0}
.msg.them.attach{color:var(--text)}
.msg.attach b{display:block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.me.attach .ico.pdf{background:#FFFFFF}
.composer{display:flex;gap:var(--sp-2);margin-top:var(--sp-3)}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:10px 14px}

/* Navegación inferior y botón + */
.tabs{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;padding:0 var(--sp-3);pointer-events:none}
.tabs nav{pointer-events:auto;max-width:496px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--nav);border-radius:26px;box-shadow:var(--sh-2)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 9px;font-size:var(--fs-xs);font-weight:700;color:rgba(255,255,255,.62);text-decoration:none}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:#FFFFFF}
.tab[aria-current="page"]::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--coral)}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 244px));bottom:96px;width:56px;height:56px;border-radius:50%;border:0;background:var(--coral);color:var(--on-color);box-shadow:0 8px 22px color-mix(in srgb,var(--coral) 40%,transparent);display:grid;place-items:center}
.fab svg{width:26px;height:26px}

/* Diálogos y avisos */
dialog{border:0;padding:0;border-radius:24px 24px 0 0;background:var(--surface);color:var(--text);width:100%;max-width:520px;margin:auto auto 0;max-height:92vh;box-shadow:var(--sh-3)}
@media (min-width:560px){dialog{border-radius:24px;margin:auto}}
dialog::backdrop{background:rgba(20,15,10,.45)}
.sheet{padding:20px 18px 22px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);opacity:0;transition:.25s;z-index:60;background:var(--text);color:var(--bg);padding:11px var(--sp-4);border-radius:var(--r-lg);font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- 6. Visor de documentos (papel siempre claro) ---------- */
dialog.viewer{width:100%;max-width:none;height:100%;max-height:none;margin:0;border-radius:0;background:var(--viewer-bg);color:#FFFFFF;padding:0;overflow:hidden}
dialog.viewer::backdrop{background:#000}
.vbar{display:flex;align-items:center;gap:10px;padding:10px var(--sp-3);background:var(--viewer-bar);color:#FFFFFF;height:58px}
.vbtn{border:0;background:rgba(255,255,255,.1);color:#FFFFFF;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.vpage{font-size:12px;font-weight:700;background:rgba(255,255,255,.12);padding:var(--sp-1) 9px;border-radius:var(--r-pill);white-space:nowrap}
.vpages{height:calc(100% - 58px);overflow:auto;padding:18px 14px 110px;display:flex;flex-direction:column;align-items:center;gap:14px}
.vfoot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:var(--sp-2);padding:var(--sp-3) 14px calc(12px + env(safe-area-inset-bottom));background:var(--viewer-bar)}
.vfoot .btn{background:#F6F1EC;color:var(--on-color)}
.vfoot .btn.ghost{background:rgba(255,255,255,.12);color:#FFFFFF}
.page{background:var(--paper);color:var(--paper-ink);width:100%;max-width:440px;aspect-ratio:1/1.414;padding:30px 26px 40px;box-shadow:0 6px 24px rgba(0,0,0,.4);font:14px/1.65 var(--font-read);position:relative;flex:none}
.page p{margin:0 0 10px}
.page .dt{font:600 20px/1.2 var(--font-read);margin:2px 0 var(--sp-1);color:var(--paper-ink)}
.page .eyebrow{font:700 10px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--danger);margin:0 0 var(--sp-1)}
.page .meta{font:500 var(--fs-xs) var(--font-ui);color:var(--paper-muted);margin:0 0 14px}
.page .cap{font-weight:600;margin-top:14px}
.page .pnum{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:500 10px var(--font-ui);color:#9A94A5}
.page del{color:#C0392B;text-decoration:line-through;text-decoration-thickness:1.5px}
.page ins{color:#1E7B45;text-decoration:underline;text-decoration-color:var(--green);text-decoration-thickness:2px;text-underline-offset:2px}
.viewer.clean .page del,.viewer.clean .page sup.cm{display:none}
.viewer.clean .page ins{color:inherit;text-decoration:none}
.page sup.cm,.page mark[data-c]::after,.cnum{font:800 9px var(--font-ui);background:var(--apricot);color:var(--on-color);border-radius:var(--r-xs);padding:1px var(--sp-1)}
.page sup.cm{margin-left:2px}
.page mark{background:#FFE3A3;color:inherit;padding:0 1px}
.page mark[data-c]::after{content:attr(data-c);margin-left:3px;vertical-align:super}
.page .score{display:flex;align-items:baseline;gap:6px;background:var(--paper-soft);border-radius:10px;padding:10px var(--sp-3);margin-bottom:var(--sp-3);font-family:var(--font-ui)}
.page .score b{font-size:28px;color:var(--on-color)} .page .score span{color:var(--paper-muted)} .page .score em{font-style:normal;margin-left:auto;font-size:var(--fs-xs);color:var(--paper-muted)}
.page table{width:100%;border-collapse:collapse;font:var(--fs-sm)/1.4 var(--font-ui);margin-bottom:var(--sp-3)}
.page .rt td{padding:5px 0;border-bottom:1px solid var(--paper-line)} .page .rt td:last-child{text-align:right;color:var(--coral);letter-spacing:2px}
.page .ct th{text-align:left;font-size:var(--fs-xs);color:var(--paper-muted);padding:var(--sp-1) 0;border-bottom:1px solid var(--paper-line)}
.page .ct td{padding:6px var(--sp-2) 6px 0;border-bottom:1px solid var(--paper-line);vertical-align:top} .page .ct td:first-child{font-weight:800;width:34px}
.page .seal{margin-top:18px;font:600 var(--fs-xs)/1.5 var(--font-ui);color:#1E7B45;background:#EEF7E3;border-radius:var(--r-sm);padding:var(--sp-2) 10px}
.cnotes{width:100%;max-width:440px;display:flex;flex-direction:column;gap:var(--sp-2)}
.cnote{display:flex;gap:10px;align-items:flex-start;background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:10px var(--sp-3);border-left:4px solid var(--apricot)}
.cnote.done{opacity:.55}
.cnum{font-size:10px;margin-top:3px}
.cact{display:flex;gap:var(--sp-3);margin-top:var(--sp-1)}
/* ---------- 7. Escritorio (web) ---------- */
.only-d{display:none}
.side-logo{display:none}
.prow{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 4px 4px}
.prow::before{content:'';position:absolute;left:8.33%;right:8.33%;top:36px;border-top:2px dashed color-mix(in srgb,var(--text) 30%,transparent)}
.pnode{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;text-decoration:none;color:inherit}
.pnode .pdot{width:56px;height:56px;border-radius:50%;background:var(--f);display:grid;place-items:center;font:800 20px var(--font-ui);color:var(--muted);position:relative}
.pnode .pdot svg{width:52px;height:52px;display:block}
.pnode.s-next .pdot{border:2px dashed color-mix(in srgb,var(--text) 35%,transparent)}
.pnode.s-now .pdot{box-shadow:0 0 0 3px var(--on-color),0 0 0 9px color-mix(in srgb,var(--coral) 35%,transparent)}
.pnode b{font-size:var(--fs-sm);margin-top:4px}
.pnode small{font-size:var(--fs-xs);color:var(--muted);line-height:1.3}
@media (min-width:1024px){
  .only-m{display:none} .only-d{display:block}
  .app{max-width:none;margin:0 0 0 240px;padding-bottom:48px}
  .topbar{padding:14px 40px}
  .topbar .logo,.topbar .pill{display:none}
  main{max-width:1120px;margin:0 auto;padding:32px 40px}
  .tabs{top:0;bottom:0;left:0;right:auto;width:240px;padding:0;pointer-events:auto}
  .tabs nav{height:100%;max-width:none;display:flex;flex-direction:column;gap:6px;border-radius:0;padding:24px 16px;box-shadow:none}
  .side-logo{display:flex;color:#FFFFFF;padding:4px 12px 28px}
  .side-logo .mark circle,.side-logo .mark path{fill:#FFFFFF}
  .side-logo span{color:#FFFFFF}
  .tab{flex-direction:row;gap:12px;padding:12px 14px;font-size:15px;border-radius:var(--r-md);justify-content:flex-start}
  .tab svg{width:22px;height:22px}
  .tab[aria-current="page"]{background:var(--coral);color:var(--on-color)}
  .tab[aria-current="page"]::after{display:none}
  .fab{right:40px;bottom:40px}
  .toast{bottom:40px}
  h1{font-size:34px}
  .uname{font-size:44px}
  .avatar.lg{width:88px;height:88px}
  .home{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start;margin-top:20px}
  .home .hmain>.card:first-child{margin-top:0!important}
  .home .hside>.section:first-child{margin-top:0}
  #results,.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  #results>*+*,.pgrid>*+*{margin-top:0}
  .exp{grid-template-columns:repeat(4,1fr)}
}
</style>

const NODE_C = ['var(--coral)','var(--apricot)','var(--green)'];
function stagePerson(p, i){
  if (i === 0) return p.authorObj || ME;
  const r = STAGE_ROLE[i]; if (!r) return null;
  const m = p.team.find(m => byId(m.uid).roles.includes(r));
  return m ? byId(m.uid) : null;
}

function pathRow(p, noLinks){
  return `<div class="prow" role="list">${STAGES.map((s, i) => {
    const u = stagePerson(p, i), state = i < p.stage ? 'done' : i === p.stage ? 'now' : 'next';
    const delivered = u && p.team.some(m => m.uid === u.id && m.status === 'delivered');
    const sub = i === 5 ? (state === 'done' ? '¡Publicado!' : 'Tu libro') : u ? ((u === ME || (SRC() && u.id === SRC().id)) ? 'Tú' : u.name.split(' ')[0]) + (delivered ? ' · entrega lista' : '') : i === 4 ? 'Próximamente' : 'Busca a alguien';
    const href = u && u !== ME && u.id !== 'base-ana' ? `#/perfil/${u.id}` : (!u && STAGE_ROLE[i]) ? `#/buscar?r=${STAGE_ROLE[i]}` : '';
    const fill = state === 'next' ? 'var(--surface)' : NODE_C[i % 3];
    const inner = u ? `<svg viewBox="0 0 52 52">${personSVG(26, 26, 24, u, fill)}</svg>` : `<span>${i === 5 ? '★' : i === 4 ? '…' : '+'}</span>`;
    const tag = href && !noLinks ? 'a' : 'div';
    return `<${tag} role="listitem" class="pnode s-${state}" ${href ? `href="${href}"` : ''}><span class="pdot" style="--f:${fill}">${inner}</span><b>${s}</b><small>${sub}</small></${tag}>`;
  }).join('')}</div>`;
}function pathMap(p){
  const pts = [[62,44],[262,110],[78,184],[262,258],[78,332],[250,402]];
  const seg = (a,b) => `C ${a[0]} ${a[1]+50}, ${b[0]} ${b[1]-50}, ${b[0]} ${b[1]}`;
  let d = `M ${pts[0][0]} ${pts[0][1]}`, done = d;
  for (let i = 1; i < pts.length; i++){ d += ' ' + seg(pts[i-1], pts[i]); if (i <= p.stage) done += ' ' + seg(pts[i-1], pts[i]); }
  const nodes = pts.map(([x,y], i) => {
    const u = stagePerson(p, i);
    const state = i < p.stage ? 'done' : i === p.stage ? 'now' : 'next';
    const right = x < 170, lx = right ? x+38 : x-38, anchor = right ? 'start' : 'end';
    const fill = state === 'next' ? 'var(--surface)' : NODE_C[i % 3];
    const stroke = state === 'next' ? 'stroke="var(--text)" stroke-opacity=".35" stroke-dasharray="4 4" stroke-width="2"'
                 : state === 'now' ? 'stroke="var(--on-color)" stroke-width="3"' : '';
    const inner = u ? personSVG(x, y, 22, u, fill)
                    : `<text class="ini plus" x="${x}" y="${y+6}" text-anchor="middle">${i === 5 ? '★' : i === 4 ? '…' : '+'}</text>`;
    const delivered = u && p.team.some(m => m.uid === u.id && m.status === 'delivered');
    const sub = i === 5 ? (state === 'done' ? '¡Publicado!' : 'Tu libro, publicado')
              : u ? ((u === ME || (SRC() && u.id === SRC().id)) ? 'Tú' : u.name.split(' ')[0]) + (delivered ? ' · entrega lista' : '')
              : i === 4 ? 'Próximamente' : 'Busca a alguien';
    const href = u && u !== ME && u.id !== 'base-ana' ? `#/perfil/${u.id}` : (!u && STAGE_ROLE[i]) ? `#/buscar?r=${STAGE_ROLE[i]}` : '';
    const g = `${state === 'now' ? `<circle class="pulse" cx="${x}" cy="${y}" r="26" fill="var(--coral)"/>` : ''}<circle cx="${x}" cy="${y}" r="26" fill="${fill}" ${stroke}/>${inner}<text class="lab" x="${lx}" y="${y-2}" text-anchor="${anchor}">${STAGES[i]}</text><text class="sub" x="${lx}" y="${y+15}" text-anchor="${anchor}">${sub}</text>`;
    return href ? `<a href="${href}" aria-label="${STAGES[i]}: ${sub}">${g}</a>` : g;
  }).join('');
  return `<svg class="pmap" viewBox="0 0 340 436" role="img" aria-label="Camino del proyecto ${p.title}: etapa ${STAGES[p.stage]}"><path d="${d}" fill="none" stroke="var(--text)" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><path d="${done}" fill="none" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>${nodes}</svg>`;
}

}

const CAREER_CUR = { lucia:4, pablo:2, irene:4 };
const CAREER_NOW = { lucia:'Te faltan 77 valoraciones', pablo:'Si Ana te encarga la novela', irene:'Te falta 1 año y 88 valoraciones' };
const careerSteps = () => CAREER_BY[ME.roles[0]] || CAREER_BY.corrector;
const careerNow = () => { const s = SRC(); return (s && CAREER_NOW[s.id]) || 'Estás aquí'; };
const SRC = () => ME.persona && ME.persona !== 'autor' ? byId(PERSONAS[ME.persona].who) : null;
const careerCur = () => { const s = SRC(); return s ? (CAREER_CUR[s.id] ?? 1) : 0; };
function careerMap(){
  const cur = careerCur();
  const pts = [[62,44],[262,110],[78,184],[262,258],[78,332],[250,402]];
  const seg = (a,b) => `C ${a[0]} ${a[1]+50}, ${b[0]} ${b[1]-50}, ${b[0]} ${b[1]}`;
  let d = `M ${pts[0][0]} ${pts[0][1]}`, done = d;
  for (let i = 1; i < pts.length; i++){ d += ' ' + seg(pts[i-1], pts[i]); if (i <= cur) done += ' ' + seg(pts[i-1], pts[i]); }
  const steps = careerSteps();
  const nodes = pts.map(([x,y], i) => {
    const state = i < cur ? 'done' : i === cur ? 'now' : 'next';
    const right = x < 170, lx = right ? x+38 : x-38, anchor = right ? 'start' : 'end';
    const fill = state === 'next' ? 'var(--surface)' : NODE_C[i % 3];
    const stroke = state === 'next' ? 'stroke="var(--text)" stroke-opacity=".35" stroke-dasharray="4 4" stroke-width="2"' : state === 'now' ? 'stroke="var(--on-color)" stroke-width="3"' : '';
    const inner = i === cur ? personSVG(x, y, 22, ME, fill) : `<text class="ini" x="${x}" y="${y+5}" text-anchor="middle" ${state === 'next' ? 'style="fill:var(--muted)"' : ''}>${state === 'done' ? '✓' : i === 5 ? '★' : i+1}</text>`;
    return `${state === 'now' ? `<circle class="pulse" cx="${x}" cy="${y}" r="26" fill="var(--coral)"/>` : ''}<circle cx="${x}" cy="${y}" r="26" fill="${fill}" ${stroke}/>${inner}<text class="lab" x="${lx}" y="${y-2}" text-anchor="${anchor}">${steps[i][0]}</text><text class="sub" x="${lx}" y="${y+15}" text-anchor="${anchor}">${state === 'now' ? careerNow() : steps[i][1]}</text>`;
  }).join('');
  return `<svg class="pmap" viewBox="0 0 340 436" role="img" aria-label="Tu camino profesional: ${steps[cur][0]}"><path d="${d}" fill="none" stroke="var(--text)" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><path d="${done}" fill="none" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>${nodes}</svg>`;
}
function careerRow(){
  const cur = careerCur(), steps = careerSteps();
  return `<div class="prow" role="list" aria-label="Tu camino profesional">${steps.map(([t, sub], i) => {
    const state = i < cur ? 'done' : i === cur ? 'now' : 'next';

    const inner = state === 'now' ? `<svg viewBox="0 0 52 52">${personSVG(26, 26, 24, ME, fill)}</svg>` : `<span>${state === 'done' ? '✓' : i === 5 ? '★' : i + 1}</span>`;

  }).join('')}</div>`;
}

  try { if (navigator.share) { await navigator.share(data); return; } } catch(e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(`${data.text} ${data.url}`); toast('Enlace copiado. Pégalo en WhatsApp o donde quieras.'); }
  catch(e) { toast('Comparte este enlace: ' + DEMO_URL); }
}

function route(){
  const [pathPart, qs=''] = location.hash.replace(/^#\/?/,'').split('?');
  const rq = new URLSearchParams(qs).get('r'); if (rq && ROLES[rq]) { filters.role = rq; history.replaceState(null, '', '#/' + pathPart); }
  const [page='', id=''] = pathPart.split('/');
  const map = { '':vInicio, buscar:vBuscar, perfil:()=>vPerfil(id), proyectos:vProyectos, proyecto:()=>vProyecto(id), mensajes:vMensajes, yo:vYo, encargo:vEncargo };
  view.innerHTML = (map[page] || vInicio)();
  const tab = {'' :'inicio', perfil:'buscar', proyecto:'proyectos', encargo:'inicio'}[page] ?? page;
  document.querySelectorAll('.tab').forEach(t => {
    if (t.dataset.tab === tab) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current');
  });
  const keep = route._keepScroll; route._keepScroll = false;
  if (!keep) window.scrollTo(0,0);
  bindView();
  const fab = document.querySelector('.fab'); if (fab) fab.style.display = ME.roles[0] === 'autor' ? '' : 'none';
  const sb = $('#signupBtn'); if (sb) sb.style.display = ME.isNew ? 'none' : '';
}
function rerender(){ const y = scrollY; route._keepScroll = true; route(); scrollTo(0,y); }

function bindView(){
  const q = $('#q');
  if (q) q.addEventListener('input', e => { filters.q = e.target.value; const pos=e.target.selectionStart; rerender(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); });
  const fv = $('#fver');
  if (fv) fv.addEventListener('change', e => { filters.verified = e.target.checked; rerender(); });
  const ps = $('#pslider');
  if (ps) { const upd = () => { const v = +ps.value, lo = +ps.dataset.lo, hi = +ps.dataset.hi; $('#pval').textContent = eur(v); const m = $('#pmsg'); m.className = 'small ' + (v < lo ? 'pm-lo' : v > hi ? 'pm-hi' : 'pm-ok'); m.textContent = v < lo ? 'Por debajo de lo recomendado: no regales tu trabajo.' : v > hi ? 'Por encima de lo recomendado: puede costarte conseguir los primeros encargos.' : '✓ Precio justo para tu nivel. Los autores verán que está justificado.'; }; ps.addEventListener('input', upd); upd(); }
  const jc = $('#jcomposer');
  if (jc) jc.addEventListener('submit', e => { e.preventDefault(); const t = jc.t.value.trim(); if (!t) return; JOB.chat.push({ from:'pro', t }); rerender(); scrollJobChat(); anaSays(ANA_REPLIES[anaIdx++ % ANA_REPLIES.length]); });
  const comp = $('#composer');
  if (comp) comp.addEventListener('submit', e => {
    e.preventDefault();
    const t = comp.t.value.trim(); if (!t) return;
    const p = projById(comp.dataset.p);
    p.chat.push({from:'ana', t}); rerender(); scrollChat();
    const other = p.team[0] && p.team[0].uid;
    if (other) setTimeout(()=>{ p.chat.push({from:other, t:REPLIES[replyIdx++ % REPLIES.length]}); if (location.hash==='#/proyecto/'+p.id){ rerender(); scrollChat(); } }, 1300);
    setTimeout(()=>{ const n=$('#composer input'); n && n.focus(); },0);
  });
}
function scrollChat(){ const c=$('#composer'); c && c.scrollIntoView({block:'end'}); }

function openNewRequest(){

    <form id="nrf" class="stack">

      <button class="btn block">Publicar solicitud</button>
    </form>`);
  $('#nrf').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target, p = projById(f.p.value);
    const r = { role:f.role.value, genre:f.genre.value, budget:Math.max(1, +f.budget.value || 5), deadline:f.deadline.value, applicants:[] };
    p.requests.push(r);
    closeDlg(); location.hash = '#/proyecto/'+p.id; toast('Solicitud publicada');
    setTimeout(()=>{
      const inTeam = new Set(p.team.map(m=>m.uid));
      let match = USERS.filter(u => u.roles.includes(r.role) && !inTeam.has(u.id));
      match.sort((a,b)=> (b.genres.includes(r.genre)) - (a.genres.includes(r.genre)) || b.rating-a.rating);
      r.applicants = match.slice(0,3).map(u=>u.id);
      if (location.hash==='#/proyecto/'+p.id) rerender();
      toast(r.applicants.length ? `¡${r.applicants.length} ${r.applicants.length===1?'persona se ha postulado':'personas se han postulado'}!` : 'Aún no hay perfiles para esto en la demo');
    }, 2500);
  });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a==='close') { closeDlg(); return; }
  if (a==='doc') { if (dlg.open) closeDlg(); openDoc(el.dataset.doc); return; }
  if (a==='notifs') { openNotifs(); return; }
  if (a.startsWith('viewer-') || a.startsWith('note-')) { viewerAct(a, el); return; }
  if (a==='waitlist') { if (WAITLIST_URL) window.open(WAITLIST_URL, '_blank', 'noopener'); else toast('El formulario de la beta estará disponible muy pronto.'); return; }
  if (a==='share') { shareDemo(); return; }
  if (a.startsWith('job-')) { jobAct(a); return; }
  if (a==='persona-open') { openPersona(); return; }
  if (a==='persona') { setPersona(el.dataset.v); closeDlg(); location.hash = '#/'; route(); toast(`Estás viendo Path 6 como ${PERSONAS[el.dataset.v].label.toLowerCase()}`); return; }
  if (a==='compare') { e.preventDefault(); openCompare(el.dataset.p); return; }
  if (a==='choose') { if (dlg.open) closeDlg(); openHire(el.dataset.id, { project: el.dataset.p, pkg: 1 }); return; }
  if (a==='notify-soon') { toast('Apuntado. Te avisaríamos cuando llegue la promoción.'); return; }
  if (a==='apply-req') { const r = OPEN_REQUESTS[+el.dataset.i]; r.applied = true; r.applicants++; rerender(); toast(`Postulación enviada. ${r.by.split(' ')[0]} verá tu perfil.`); return; }
  if (a==='apply') { toast('En esta demo eres autora. Los lectores beta y profesionales se postulan desde aquí.'); return; }
  if (a==='f-role') { filters.role = el.dataset.v; rerender(); return; }
  if (a==='f-genre') { filters.genre = filters.genre===el.dataset.v ? '' : el.dataset.v; rerender(); return; }
  if (a==='f-clear') { Object.assign(filters,{q:'',role:'todos',genre:'',verified:false}); rerender(); return; }
  if (a==='hire') { if (!PROJECTS.length) { toast('Para contratar, crea primero un proyecto como autor/a.'); return; } openHire(el.dataset.id); return; }
  if (a==='msg') { const p = PROJECTS.find(p=>p.team.some(m=>m.uid===el.dataset.id)); if (p) location.hash='#/proyecto/'+p.id; else toast('Para abrir un chat, contrátala o invítala a un proyecto.'); return; }
  if (a==='approve') { openApprove(el.dataset.p, +el.dataset.i); return; }
  if (a==='simulate-delivery') { const p=projById(el.dataset.p), m=p.team[+el.dataset.i]; m.status='delivered'; p.chat.push({from:m.uid, t:'¡Listo! Te he subido la entrega 📎'}); rerender(); toast('Entrega recibida'); return; }
  if (a==='new-request') { openNewRequest(); return; }
  if (a==='accept') { const p=projById(el.dataset.p), r=p.requests[+el.dataset.r]; openHire(el.dataset.id,{project:p.id, price:r.budget, request:{p:p.id, ri:+el.dataset.r}}); return; }
  if (a==='hire-next') {
    if (hire.step===0){ const c = body.querySelector('input[name=pkg]:checked'); hire.pkg = c ? +c.value : 0; hire.project = $('#hproj').value; }
    hire.step++; if (hire.step === 2 && (hire.price ?? hire.u.packages[hire.pkg].p) === 0) { hireFreeDone(); return; } hireStep(); return;
  }
  if (a==='hire-prev') { hire.step--; hireStep(); return; }
  if (a==='hire-pay') {
    const { u } = hire, p = projById(hire.project), pkg = u.packages[hire.pkg], price = hire.price ?? pkg.p;
    p.team.push({ uid:u.id, service:pkg.n, price, status:'progress' });
    const st = +Object.keys(STAGE_ROLE).find(k => u.roles.includes(STAGE_ROLE[k])); if (p.stage === 0 && st) p.stage = st;
    p.chat.push({ from:'sys', t:`${u.name.split(' ')[0]} se unió al proyecto. Pago de ${eur(price,true)} retenido por Path6 hasta que apruebes la entrega.` });
    p.chat.push({ from:u.id, t:`¡Hola, ${ME.name.split(' ')[0]}! Gracias por elegirme. Empiezo esta semana 😊` });
    if (hire.request) p.requests.splice(hire.request.ri, 1);
    hire.step = 3; hireStep(); rerender(); return;
  }
});

const WORK = {
  lector:     [{ title:'Café para dos', by:'Marta S.', what:'Lectura beta · novela completa', status:'Completado · valoración ★★★★★', money:'14,00 € cobrados', pill:'14 €', doc:'', st:'done' }],
  corrector:  [{ title:'El faro (relato)', by:'Daniel P.', what:'Corrección ortotipográfica', status:'Completado · valoración ★★★★★', money:'20,00 € cobrados', pill:'20 €', doc:'', st:'done' }],
  ilustrador: [{ title:'Reino de ceniza', by:'Tomás R.', what:'Portada digital', status:'Completado · valoración ★★★★★', money:'40,00 € cobrados', pill:'40 €', doc:'', st:'done' }],
};function setPersona(v){
  if (!PERSONAS[v]) v = 'autor';
  try { localStorage.setItem('path6-persona', v); } catch(e) {}
  Object.keys(ME).forEach(k => delete ME[k]);
  Object.assign(ME, JSON.parse(JSON.stringify(BASE.me)), { persona: v });
  PROJECTS.length = 0; JSON.parse(JSON.stringify(BASE.projects)).forEach(p => PROJECTS.push(p));
  LOOK.ana = BASE.look.slice();
  if (v !== 'autor') {
    const u = byId(PERSONAS[v].who);
    Object.assign(ME, { name:u.name, ini:u.ini, color:u.color, loc:u.loc, roles:[v], genres:u.genres.slice(), bio:u.bio, path:2 });
    LOOK.ana = LOOK[u.id].slice();
    PROJECTS.length = 0;
  }
  JOB = v !== 'autor' ? makeJob(v) : null;
}
function openPersona(){
  openDlg(`${head('¿Cómo quieres ver Path 6?')}
    <p class="small muted" style="margin:-6px 0 14px">Elige un tipo de usuario para ver cómo funciona la app para cada uno. Puedes cambiarlo cuando quieras desde tu perfil.</p>
    <div class="stack">${Object.entries(PERSONAS).map(([k,p]) => { const u = k === 'autor' ? Object.assign({}, BASE.me, { id:'ana' }) : byId(p.who); return `<button type="button" class="opt roleb persona ${ME.persona === k ? 'on' : ''}" data-act="persona" data-v="${k}"><span class="row" style="gap:12px;width:100%"><span class="avatar" style="width:52px;height:52px"><svg viewBox="0 0 44 44" width="100%" height="100%">${personSVG(22,22,22, k === 'autor' ? { id:'base-ana', color:BASE.me.color } : u)}</svg></span><span style="flex:1;text-align:left"><b>${p.label}</b><br><span class="small muted">${p.desc}</span><br><span class="small" style="font-weight:700">Como ${u.name}</span></span></span></button>`; }).join('')}</div>`);
}
LOOK['base-ana'] = BASE.look.slice();
function workSection(){
  const w = WORK[ME.roles[0]] || [];
  if (!w.length) return '';
  return `<section class="section"><div class="section-head"><h2>Trabajos anteriores</h2></div><div class="stack">${w.map(j => `
    <article class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><p class="small muted" style="margin:0">${j.by}</p><h3 style="margin:2px 0 4px">${j.title}</h3><p class="small" style="margin:0">${j.what}</p></div><span class="price">${j.pill}</span></div>
      <p class="status ${j.st}" style="margin:8px 0 0">● ${j.status}</p></article>`).join('')}</div></section>`;
}
// ===== Encargos del profesional (simulación completa con Ana) =====
let JOB = null;
const ANA_USER = { id:'base-ana', name:'Ana Ruiz', ini:'AR', color:'var(--apricot)', roles:['autor'], genres:['Romance','Fantasía'] };
const ROLE_STAGE = { lector:1, corrector:2, ilustrador:3 };
function makeJob(role){
  const first = ME.name.split(' ')[0];
  const base = { id:'j1', state:'request', chat:[] };
  let j;
  if (role === 'lector') j = { ...base, service:'Lectura beta · 10 capítulos', price:5, deadline:'7 días', doc:'informe', fileName:'Informe_lectura_cap1-10.pdf',
      ask:`Hola, ${first}. He visto tu perfil y me encanta cómo trabajas el romance. ¿Podrías leer los 10 primeros capítulos de «Lo que el río calla»? Te pagaría los 5 € por Path 6.` };
  else if (role === 'corrector') j = { ...base, service:'Prueba gratis · capítulo 1', price:0, deadline:'3 días', doc:'correccion', fileName:'Capitulo1_prueba_correccion.pdf',
      ask:`Hola, ${first}. Estoy comparando correctores para mi novela. ¿Me harías la prueba gratis del capítulo 1? Si me convence, te encargo la novela completa.`, next:{ service:'Corrección completa · 82.000 palabras', price:160, fileName:'Lo_que_el_rio_calla_corregido.pdf' } };
  else j = { ...base, service:'Boceto gratis de portada', price:0, deadline:'5 días', doc:'boceto', fileName:'Boceto_portada_rio.pdf',
      ask:`Hola, ${first}. Me encantan tus portadas de fantasía. ¿Podrías hacerme un boceto para «Lo que el río calla»? Es romance con un toque de magia, en Sevilla, junto al río.`, next:{ service:'Portada digital (ebook)', price:40, fileName:'Portada_final_rio.pdf' } };
  j.chat.push({ from:'base-ana', t:j.ask });
  return j;
}
// El proyecto de Ana visto por el profesional: su etapa resaltada dentro del camino del libro.
function jobProject(j){
  const role = ME.roles[0], src = SRC(), st = ROLE_STAGE[role];
  const team = [{ uid:'lucia', status:'done' }];
  if (role === 'ilustrador') team.push({ uid:'pablo', status:'done' });
  const mine = { request:'progress', accepted:'progress', delivered:'delivered', approved:'done' }[j.state];
  if (role === 'lector') team.length = 0;
  team.push({ uid:src.id, status:mine });
  return { id:'rio', title:'Lo que el río calla', stage:st, team, authorObj:ANA_USER };
}
const JOB_STATES = ['Solicitud','Aceptado','Entregado','Aprobado'];
const jobIdx = j => ({ request:0, accepted:1, delivered:2, approved:3 })[j.state];
function jobCard(){
  const j = JOB; if (!j) return '';
  const p = BASE.projects[0];
  return `<a class="card card-link mapcard jobc" href="#/encargo/${j.id}" style="margin-top:16px">
    <div class="row" style="gap:12px;padding:10px 12px 2px;align-items:center">${cover(p)}<div style="min-width:0"><p class="small muted" style="margin:0">Tu encargo actual · de Ana Ruiz</p><h2 style="margin:2px 0">${p.title}</h2><p class="small" style="margin:0">${j.service} · ${j.price ? eur(j.price) : 'Gratis'}</p></div></div>
    <div class="tl" style="padding:0 12px">${JOB_STATES.map((s,i) => `<span class="${i <= jobIdx(j) ? 'on' : ''}">${s}</span>`).join('')}</div>
    <div style="padding:12px"><span class="btn sm block">${j.state === 'request' ? 'Ver la solicitud de Ana' : 'Abrir encargo'}</span></div></a>`;
}
function jobAction(j){
  const pay = j.price ? `${eur(j.price,true)} · pago protegido por Path 6` : 'Gratis · es una prueba para que Ana te conozca';
  if (j.state === 'request') return `<p class="small" style="margin:0;font-weight:700">Ana Ruiz te ha escrito</p><h2 style="margin:4px 0 4px">${j.service}</h2><p class="small muted" style="margin:0 0 10px">${pay} · plazo ${j.deadline}</p><div class="row" style="gap:8px"><button class="btn sm" data-act="job-accept">Aceptar encargo</button><button class="btn sm ghost" data-act="job-decline">Ahora no</button></div>`;
  if (j.state === 'accepted') return `<p class="small" style="margin:0;font-weight:700">Manos a la obra</p><h2 style="margin:4px 0 4px">${j.service}</h2><p class="small muted" style="margin:0 0 10px">Entrega antes de ${j.deadline}. ${j.price ? `Ana ya ha pagado: Path 6 guarda los ${eur(j.price,true)} hasta que apruebe.` : ''}</p><button class="btn sm" data-act="job-deliver">Entregar trabajo</button>`;
  if (j.state === 'delivered') return `<p class="small" style="margin:0;font-weight:700">Entregado</p><h2 style="margin:4px 0 4px">Ana lo está revisando</h2><p class="small muted" style="margin:0 0 10px">${j.price ? `Cuando lo apruebe, Path 6 te liberará ${eur(j.price,true)}.` : 'Está comparando tu prueba con las de otras personas.'}</p><button class="btn sm" data-act="job-sim">Simular respuesta de Ana</button>`;
  if (j.next) return `<p class="small" style="margin:0;font-weight:700">¡Ana te ha elegido!</p><h2 style="margin:4px 0 4px">${j.next.service}</h2><p class="small muted" style="margin:0 0 10px">${eur(j.next.price,true)} · pago protegido por Path 6</p><button class="btn sm" data-act="job-next">Aceptar el encargo</button>`;
  return `<p class="small" style="margin:0;font-weight:700">Trabajo terminado</p><h2 style="margin:4px 0 4px">Has cobrado ${eur(j.price,true)}</h2><p class="small muted" style="margin:0">Ana te ha valorado con ★★★★★. Tu perfil sube un paso en tu camino.</p>`;
}
function jobMsg(m){
  if (m.from === 'sys') return `<div class="msg sys">${m.t}</div>`;
  const mine = m.from === 'pro';
  if (m.file) return `<button class="msg ${mine ? 'me' : 'them'} attach" data-act="doc" data-doc="${m.file}">${mine ? '' : '<span class="who">Ana</span>'}<span class="row" style="gap:10px"><span class="ico pdf">PDF</span><span style="text-align:left"><b class="small">${esc(m.name)}</b><br><span class="small" style="opacity:.8">Toca para abrir</span></span></span></button>`;
  return mine ? `<div class="msg me">${esc(m.t)}</div>` : `<div class="msg them"><span class="who">Ana</span>${esc(m.t)}</div>`;
}
function vEncargo(){
  const j = JOB; if (!j) return `<div class="empty">No hay encargos.</div>`;
  const p = BASE.projects[0];
  return `
  <a class="back" href="#/">${icoBack}Inicio</a>
  <section class="card"><div class="row" style="align-items:flex-start;gap:12px">${cover(p)}<div><p class="small muted" style="margin:0">de Ana Ruiz · Novela · Romance</p><h1 style="font-size:22px">${p.title}</h1><p class="small" style="margin:4px 0 0">${j.service}</p><p class="small muted" style="margin:0">${j.price ? eur(j.price,true) : 'Gratis'} · plazo ${j.deadline}</p></div></div>
    <div class="tl">${JOB_STATES.map((s,i) => `<span class="${i <= jobIdx(j) ? 'on' : ''}">${s}</span>`).join('')}</div></section>
  <section class="next">${jobAction(j)}</section>
  <section class="section" id="chat"><div class="section-head"><h2>Chat con Ana</h2></div>
    <div class="card"><div class="chat">${j.chat.map(jobMsg).join('')}</div>
    <form class="composer" id="jcomposer"><input name="t" placeholder="Escribe a Ana…" aria-label="Mensaje" autocomplete="off"><button class="btn" aria-label="Enviar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 12 20 4l-6 16-3-7z"/></svg></button></form></div>
  </section>`;
}
const ANA_REPLIES = ['¡Genial, muchas gracias!', 'Perfecto, me viene muy bien.', 'Qué ganas de verlo 😊'];
let anaIdx = 0;
function anaSays(t, delay=1200){ setTimeout(() => { JOB.chat.push({ from:'base-ana', t }); if (location.hash.startsWith('#/encargo')) { rerender(); scrollJobChat(); } else toast('Ana te ha respondido'); }, delay); }
function scrollJobChat(){ const c = $('#jcomposer'); c && c.scrollIntoView({ block:'end' }); }
function openDeliver(){
  const j = JOB;
  openDlg(`${head('Entregar trabajo')}
    <p class="small muted" style="margin:-6px 0 12px">Adjunta tu entrega. En la demo puedes usar un PDF de ejemplo o elegir un archivo tuyo (no se sube a ningún sitio).</p>
    <div class="file open" style="margin-bottom:10px"><span class="ico pdf">PDF</span><div style="flex:1;min-width:0"><b class="small" id="dname">${j.fileName}</b><div class="muted small">PDF de ejemplo · generado para la demo</div></div><button type="button" class="btn sm ghost" data-act="doc" data-doc="${j.doc}">Vista previa</button></div>
    <label class="field"><span>O elige un archivo de tu dispositivo</span><input type="file" id="dfile" accept=".pdf,.doc,.docx,.png,.jpg"></label>
    <label class="field" style="margin-top:10px"><span>Mensaje para Ana</span><textarea id="dmsg" rows="3">¡Hola, Ana! Te dejo la entrega. Cualquier duda, me dices.</textarea></label>
    <button class="btn block" style="margin-top:14px" data-act="job-send">Enviar entrega</button>`);
  $('#dfile').addEventListener('change', e => { const f = e.target.files[0]; if (f) $('#dname').textContent = f.name; });
}
function jobAct(a){
  const j = JOB;
  if (a === 'job-accept') { j.state = 'accepted'; j.chat.push({ from:'pro', t:'¡Hola, Ana! Me encanta tu historia. Acepto, me pongo con ello esta semana.' }); j.chat.push({ from:'sys', t: j.price ? `Ana ha pagado ${eur(j.price,true)}. Path 6 lo guarda hasta que apruebe la entrega.` : 'Prueba gratis aceptada. No hay pago.' }); anaSays('¡Qué bien! Muchas gracias 💛'); rerender(); toast('Encargo aceptado'); return; }
  if (a === 'job-decline') { toast('En la demo, acéptalo para ver todo el proceso.'); return; }
  if (a === 'job-deliver') { openDeliver(); return; }
  if (a === 'job-send') { const name = $('#dname').textContent, msg = $('#dmsg').value.trim(); if (msg) j.chat.push({ from:'pro', t:msg }); j.chat.push({ from:'pro', file:j.doc, name }); j.state = 'delivered'; closeDlg(); rerender(); scrollJobChat(); toast('Entrega enviada a Ana'); anaSays('¡Recibido! Lo reviso esta noche 😊'); return; }
  if (a === 'job-sim') { j.state = 'approved';
    if (j.next) { j.chat.push({ from:'base-ana', t:'He comparado las pruebas y la tuya es la que más me gusta. ¿Te encargo el trabajo completo?' }); j.chat.push({ from:'sys', t:`Ana te ha elegido para: ${j.next.service} · ${eur(j.next.price,true)}.` }); }
    else { j.chat.push({ from:'base-ana', t:'¡Me ha encantado! Muy claro y útil. Lo apruebo ✨' }); j.chat.push({ from:'sys', t:`Ana ha aprobado la entrega. Path 6 te ha liberado ${eur(j.price,true)}. Valoración: ★★★★★` }); }
    rerender(); scrollJobChat(); return; }
  if (a === 'job-next') { Object.assign(j, { service:j.next.service, price:j.next.price, fileName:j.next.fileName, state:'accepted', deadline:'3 semanas', next:null }); j.chat.push({ from:'pro', t:'¡Claro que sí! Empiezo con la novela completa.' }); j.chat.push({ from:'sys', t:`Ana ha pagado ${eur(j.price,true)}. Path 6 lo guarda hasta que apruebe la entrega.` }); rerender(); toast('Nuevo encargo aceptado'); return; }
}{ const nav = document.querySelector('.tabs nav'), lg = document.querySelector('.topbar .logo').cloneNode(true); lg.classList.add('side-logo'); lg.setAttribute('aria-label','Path 6, inicio'); nav.prepend(lg); }
let savedPersona = null;
try { savedPersona = localStorage.getItem('path6-persona'); } catch(e) {}
if (savedPersona && PERSONAS[savedPersona]) setPersona(savedPersona); else ME.persona = 'autor';
window.addEventListener('hashchange', route);
route();
if (!savedPersona) openPersona();
</script>
